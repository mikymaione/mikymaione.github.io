<!DOCTYPE html>
<html lang="it">

<head>
    <!--#include file="head.shtml" -->
    <title>maionemiky.it - 😇 Santa Lidia 2025</title>

    <style>
        #game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            justify-content: center;
            margin: 30px auto;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1;
        }

        .card {
            background-color: #fff;
            border: 2px solid #d6336c;
            border-radius: 10px;
            width: 100%;
            aspect-ratio: 1 / 1;
            font-size: clamp(24px, 6vw, 36px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d6336c;
            transition: transform 0.2s;
        }

        .card:active {
            transform: scale(0.95);
        }

        @media (min-width: 600px) {
            .card {
                height: 90px;
                width: 90px;
                font-size: 32px;
            }
        }

        @media (min-width: 900px) {
            .card {
                height: 100px;
                width: 100px;
                font-size: 36px;
            }
        }

        .matched {
            background-color: #ffc0cb;
            cursor: default;
        }

        #message {
            display: none;
            margin-top: 30px;
            font-size: 24px;
            animation: fadeIn 2s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .firework {
            position: absolute;
            border-radius: 50%;
            width: 10px;
            height: 10px;
            background: red;
            animation: explode 1s ease-out forwards;
        }

        @keyframes explode {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            100% {
                transform: scale(5);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <!--#include file="navigator.shtml" -->
    <h2>😇 Santa Lidia 2025</h2>
    <p>Scopri tutte le coppie nel gioco della memoria per sbloccare una sorpresa!</p>
    <div id="game-board"></div>
    <div id="message">✨ Complimenti! Hai completato il gioco! 🎈</div>

    <script>
        const emojis = ['🎈', '🎂', '🎁', '🍰', '🎉', '🍾', '💐', '🎊'];
        let cards = [...emojis, ...emojis];
        cards = cards.sort(() => 0.5 - Math.random());

        const board = document.getElementById('game-board');
        const message = document.getElementById('message');
        let firstCard = null;
        let lock = false;

        cards.forEach((emoji, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.index = index;
            card.dataset.emoji = emoji;
            card.textContent = '';
            card.addEventListener('click', () => {
                if (lock || card.classList.contains('matched') || card.textContent) return;
                card.textContent = emoji;
                if (!firstCard) {
                    firstCard = card;
                } else {
                    lock = true;
                    if (firstCard.dataset.emoji === card.dataset.emoji) {
                        firstCard.classList.add('matched');
                        card.classList.add('matched');
                        firstCard = null;
                        lock = false;
                        checkCompletion();
                    } else {
                        setTimeout(() => {
                            firstCard.textContent = '';
                            card.textContent = '';
                            firstCard = null;
                            lock = false;
                        }, 1000);
                    }
                }
            });
            board.appendChild(card);
        });

        function checkCompletion() {
            const matchedCards = document.querySelectorAll('.matched');
            if (matchedCards.length === cards.length) {
                message.style.display = 'block';
                launchFireworks();
            }
        }

        function launchFireworks() {
            for (let i = 0; i < 20; i++) {
                const firework = document.createElement('div');
                firework.className = 'firework';
                firework.style.top = `${Math.random() * window.innerHeight}px`;
                firework.style.left = `${Math.random() * window.innerWidth}px`;
                firework.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
                document.body.appendChild(firework);
                setTimeout(() => firework.remove(), 1000);
            }
        }
    </script>

    <!--#include file="footer.shtml" -->
</body>

</html>
