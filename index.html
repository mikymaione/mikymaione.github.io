	<figure>
		<img alt="A game character" id="thePlayer" class="img-max-size" src="images/pixel.png">
		<figcaption id="playerDescription"></figcaption>
	</figure>

	<script>
		const players = [
			{% for p in site.data.personaggi %}
				{ id: "{{ p.id }}", copyright: "{{ p.copyright }}" }
			{% unless forloop.last %},{% endunless %}
			{% endfor %}
		];

		const i = Math.floor(Math.random() * players.length);
		const selectedPlayer = players[i]; // Questa variabile serviva!

		let thePlayer = document.getElementById("thePlayer");       
		let playerDesc = document.getElementById("playerDescription");

		// Aggiorniamo tutto
		thePlayer.src = `images/players/${selectedPlayer.id}.png`;
		thePlayer.alt = `Pixel art of ${selectedPlayer.copyright}`;
		playerDesc.innerText = selectedPlayer.copyright;
	</script>
