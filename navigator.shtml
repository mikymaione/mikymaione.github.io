	<script>
		function AggiungiFiglioProj(nome)
		{
			let A = document.createTextNode(' > ');
			let RC = document.createElement('b');
			RC.innerText = nome;

			let nav_projects = document.getElementById('nav_projects');
			nav_projects.parentNode.insertBefore(A, nav_projects.nextSibling);
			A.parentNode.insertBefore(RC, A.nextSibling);
		}

		let wlp = window.location.pathname;
		wlp = wlp.replace('/', '');
		wlp = wlp.replace('.shtml', '');
		wlp = wlp || 'index';

		let nav = document.getElementById('nav_' + wlp);

		if (nav)
			nav.className = 'not-active';

		try
		{
			if (SonoSottoProgetto)
				AggiungiFiglioProj(wlp);
		}
		catch (error)
		{
			// non SonoSottoProgetto
		}
	</script>
