	<h2>Bookshelf</h2>

	<p>Currently housing <strong>{{ site.data.Bookshelf.size }}</strong> books in my personal library:</p>

	<table>
		<thead>
			<tr>
				<th>Autore</th>
				<th>Titolo</th>
			</tr>
		</thead>
		<tbody class="small">
			{% for libro in site.data.Bookshelf %}
			<tr>
				<td>{{ libro.Authors }}</td>
				<td class="giustificato">{{ libro.Title }}</td>
			</tr>
			{% endfor %}
		</tbody>
	</table>
